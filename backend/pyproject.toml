[project]
name = "woodshed"
version = "0.1.0"
description = "Take a song apart, then practise inside it."
requires-python = ">=3.11"

# NOTE: torch is deliberately absent. It must be installed separately from
# PyTorch's own index so the CUDA build is used -- listing it here would let
# pip replace that build with the CPU-only wheel, silently losing the GPU.
#
#   pip install torch --index-url https://download.pytorch.org/whl/cu121 \
#       --force-reinstall --no-deps
#
# The beat model is absent for the same reason: beat-this and
# rotary-embedding-torch both ask for torch, and must be installed with
# --no-deps so they use the CUDA build already there (torchaudio too, from
# the same cu121 index). Their remaining needs are listed below.
#
#   pip install beat-this rotary-embedding-torch --no-deps
#
# Whisper (lyrics) likewise asks for torch:
#
#   pip install openai-whisper --no-deps
dependencies = [
    "audio-separator",
    "onnxruntime",          # plain build only; never onnxruntime-gpu
    "soundfile",
    "numpy",
    "librosa",
    "audioread",
    "einops",               # used by the beat model
    "soxr",
    "tqdm",
    "tiktoken",             # used by Whisper
    "more-itertools",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.scripts]
woodshed = "woodshed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woodshed"]
